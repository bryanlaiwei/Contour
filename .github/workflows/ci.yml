name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      # A service container's 10s health interval kept the job idle after
      # Postgres was already accepting connections (run 38507544017: ready
      # 03:41:37, step ended 03:41:51). Start it here and poll every second
      # so the image pull overlaps setup-node and npm ci.
      - name: Start Postgres
        run: |
          docker run -d --name ci-pg \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and migrate
        run: |
          set -euo pipefail
          npm run typecheck &
          typecheck_pid=$!
          ready=0
          for _ in $(seq 1 90); do
            if docker exec ci-pg pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Postgres did not become ready" >&2
            docker logs ci-pg >&2 || true
            kill "$typecheck_pid" || true
            exit 1
          fi
          for f in supabase/migrations/*.sql; do
            docker exec -i ci-pg psql -U postgres -v ON_ERROR_STOP=1 -d postgres < "$f"
          done
          wait "$typecheck_pid"
      - run: npm run build:server
      - run: npm test
